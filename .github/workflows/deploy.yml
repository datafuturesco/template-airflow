name: Compile and Deploy
on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
env:
  tf_version: "1.5.7"
  tg_version: "0.53.2"
jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@main
      - name: Set env
        run: |
          echo "VERSION=$(date --rfc-3339=date)-sha-$(git log --pretty=format:'%h' -n 1)" >> $GITHUB_ENV
          echo "GIT_MESSAGE=$(git log -1 --pretty=format:"%s @ %ai"  $*)" >> $GITHUB_ENV
          echo "CHANNEL=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            dev:
              - 'live/dev/**'
            prod:
              - 'live/prod/**'

      - name: create directory to pass ssh-agent socket
        if: ${{ (steps.changes.outputs.dev == 'true') || (steps.changes.outputs.prod == 'true') }}
        run: "mkdir -p /home/runner/work/_temp/_github_workflow"
        shell: bash
      - uses: webfactory/ssh-agent@v0.7.0
        if: ${{ (steps.changes.outputs.dev == 'true') || (steps.changes.outputs.prod == 'true') }}
        with:
          ssh-private-key: ${{ secrets.GH_SSH_DEPOY_PRIVATE_KEY }}
          ssh-auth-sock: "/home/runner/work/_temp/_github_workflow/ssh-agent.sock"

      - name: DEV - Plan
        if: ${{ (steps.changes.outputs.dev == 'true') }}
        uses: gruntwork-io/terragrunt-action@v2
        env:
          SSH_AUTH_SOCK: "/github/workflow/ssh-agent.sock"
          INPUT_PRE_EXEC_1: |
            rm -Rf ~/.aws
            mkdir ~/.aws
            touch ~/.aws/credentials
            echo "[datafuturesco-dev]" >> ~/.aws/credentials
            echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
            echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: live/dev
          tg_command: "run-all plan -lock=false"

      - name: DEV - Apply
        if: ${{ (steps.changes.outputs.dev == 'true') }}
        uses: gruntwork-io/terragrunt-action@v2
        env:
          SSH_AUTH_SOCK: "/github/workflow/ssh-agent.sock"
          INPUT_PRE_EXEC_1: |
            rm -Rf ~/.aws
            mkdir ~/.aws
            touch ~/.aws/credentials
            echo "[datafuturesco-dev]" >> ~/.aws/credentials
            echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
            echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: live/dev
          tg_command: "run-all apply -lock=false"

      - name: PROD - Plan
        if: ${{ (steps.changes.outputs.prod == 'true') }}
        uses: gruntwork-io/terragrunt-action@v2
        env:
          SSH_AUTH_SOCK: "/github/workflow/ssh-agent.sock"
          INPUT_PRE_EXEC_1: |
            rm -Rf ~/.aws
            mkdir ~/.aws
            touch ~/.aws/credentials
            echo "[datafuturesco-prod]" >> ~/.aws/credentials
            echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
            echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: live/prod
          tg_command: "run-all plan"
      - name: PROD - Apply
        if: ${{ (steps.changes.outputs.prod == 'true') }}
        uses: gruntwork-io/terragrunt-action@v2
        env:
          SSH_AUTH_SOCK: "/github/workflow/ssh-agent.sock"
          INPUT_PRE_EXEC_1: |
            rm -Rf ~/.aws
            mkdir ~/.aws
            touch ~/.aws/credentials
            echo "[datafuturesco-prod]" >> ~/.aws/credentials
            echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
            echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: live/prod
          tg_command: "run-all apply"
